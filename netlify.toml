# Demo publica del frontend: sin backend, los datos viven en el navegador (VITE_DEMO).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_DEMO = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker debe revisarse en cada visita para que las actualizaciones lleguen rápido
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
